<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add('js');</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ – Lernseite</title>
<style>
/* Layout and quiz styles: based on the exam-question-generator quiz template (SE-Probetest). */
:root {
  --bg: #f4f6fa; --panel: #ffffff; --text: #1d2433; --muted: #5d6677; --line: #dde3ec;
  --accent: #1f5f99; --accent-soft: #e4eef9; --tile: #eef1f6; --tile-text: #3b4456;
  --answered: #c9dcf2; --ok: #1e8a4c; --ok-soft: #dff3e7; --bad: #c0392b; --bad-soft: #fbe3e0;
  --code-bg: #f1f3f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --panel: #1b212b; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3442;
    --accent: #6aa8e8; --accent-soft: #1f3048; --tile: #232b37; --tile-text: #c4cad5;
    --answered: #2c4a6e; --ok: #4cc47f; --ok-soft: #173826; --bad: #ef6b5b; --bad-soft: #43201c;
    --code-bg: #232a35;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --panel: #1b212b; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3442;
  --accent: #6aa8e8; --accent-soft: #1f3048; --tile: #232b37; --tile-text: #c4cad5;
  --answered: #2c4a6e; --ok: #4cc47f; --ok-soft: #173826; --bad: #ef6b5b; --bad-soft: #43201c;
  --code-bg: #232a35;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
aside h1 { font-size: 17px; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.tabs { display: flex; gap: 6px; margin: 4px 0 12px; }
.tabs button { flex: 1; border: 1px solid var(--line); background: var(--tile); color: var(--tile-text); border-radius: 8px; padding: 8px 6px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
.tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.progress { height: 6px; background: var(--tile); border-radius: 3px; overflow: hidden; margin: 6px 0 4px; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.stat { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
.group { margin-top: 14px; }
.group h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.tile { aspect-ratio: 1; border: 1px solid transparent; border-radius: 5px; background: var(--tile); color: var(--tile-text); font: 600 12px/1 system-ui, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; position: relative; }
.tile:hover { border-color: var(--accent); }
.tile.answered { background: var(--answered); }
.tile.current { outline: 2px solid var(--accent); outline-offset: 1px; }
.tile.ok { background: var(--ok); color: #fff; }
.tile.bad { background: var(--bad); color: #fff; }
.tile.skipped { background: transparent; border: 1px dashed var(--bad); color: var(--bad); }
.tile.inp::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 1px; background: var(--accent); }
.tile.ok.inp::after, .tile.bad.inp::after { background: #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 12px; font-size: 12px; color: var(--muted); margin-top: 14px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--c); border: 1px solid var(--b, transparent); }
main { overflow-y: auto; padding: 28px 32px 40px; }
.card { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px 26px; }
.meta { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 10px; flex-wrap: wrap; }
.pill { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-weight: 600; }
.pill.x { background: transparent; border: 1px solid var(--accent); }
.qtext { font-size: 18px; font-weight: 600; margin: 4px 0 14px; }
.card pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font: 13.5px/1.45 ui-monospace, "DejaVu Sans Mono", monospace; margin: 0 0 14px; }
.card code { background: var(--code-bg); border-radius: 3px; padding: 0 4px; font: 0.92em ui-monospace, "DejaVu Sans Mono", monospace; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; background: var(--panel); color: var(--text); border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 14px; font: inherit; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 5px; background: var(--tile); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { background: var(--accent); color: #fff; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt.missed { border-style: dashed; border-color: var(--ok); }
.opt.missed .k { background: transparent; color: var(--ok); border: 1.5px dashed var(--ok); }
.opt:disabled { cursor: default; }
.multi-hint { font-size: 13px; color: var(--muted); margin: -8px 0 12px; }
.inpwrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.inpwrap input { flex: 1; min-width: 200px; font: 17px ui-monospace, "DejaVu Sans Mono", monospace; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); }
.inpwrap input:focus { outline: none; border-color: var(--accent); }
.inpwrap input.right { border-color: var(--ok); background: var(--ok-soft); }
.inpwrap input.wrong { border-color: var(--bad); background: var(--bad-soft); }
.inpwrap .unit { color: var(--muted); font-size: 14px; }
.confirm { margin-top: 14px; }
.explain { margin-top: 14px; padding: 12px 14px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 4px; font-size: 14px; }
.explain b.res-ok { color: var(--ok); } .explain b.res-bad { color: var(--bad); }
.explain .nc { color: var(--muted); }
.reflink { display: inline-block; margin-top: 10px; }
.nav { max-width: 820px; margin: 16px auto 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.nav .spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 9px 16px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 5px 11px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.pulse { border-color: var(--accent); color: var(--accent); }
.score { max-width: 820px; margin: 0 auto 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; display: none; }
.score.show { display: block; }
.score .big { font-size: 26px; font-weight: 700; }
.score table { border-collapse: collapse; margin-top: 8px; font-size: 14px; width: 100%; }
.score td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); }
.score td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.hint { max-width: 820px; margin: 14px auto 0; color: var(--muted); font-size: 12.5px; }
.demo { max-width: 820px; margin: 0 auto 14px; padding: 10px 14px; border: 1.5px dashed var(--accent); border-radius: 8px; font-size: 13.5px; color: var(--muted); }
.toggle { display: none; }
.mode { display: flex; align-items: center; gap: 10px; margin: 12px 0 2px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; user-select: none; }
.mode input { position: absolute; opacity: 0; pointer-events: none; }
.mode .sw { flex: none; width: 36px; height: 20px; border-radius: 999px; background: var(--tile); border: 1px solid var(--line); position: relative; transition: background .15s; }
.mode .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.mode input:checked + .sw { background: var(--accent); border-color: var(--accent); }
.mode input:checked + .sw::after { transform: translateX(16px); background: #fff; }
.mode small { display: block; color: var(--muted); font-size: 12px; }
/* summary view */
.toc { list-style: none; margin: 10px 0 0; padding: 0; font-size: 13.5px; }
.toc li { margin: 0; }
.toc a { display: block; padding: 3px 8px; border-radius: 5px; color: var(--text); text-decoration: none; }
.toc a:hover { background: var(--tile); }
.toc a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc .l2 a { font-weight: 700; margin-top: 8px; }
.toc .l3 a { padding-left: 18px; }
.toc .l4 a { padding-left: 30px; font-size: 12.5px; color: var(--muted); }
.docbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.paper { max-width: 900px; margin: 0 auto; background: #fff; color: #1a1a1a; border: 1px solid var(--line); border-radius: 10px; padding: 34px 44px 48px; }
.backbtn { position: fixed; right: 26px; bottom: 22px; z-index: 5; box-shadow: 0 3px 12px rgba(0,0,0,.25); }
@keyframes flash { from { background: #fefcbf; } to { background: transparent; } }
.flash { animation: flash 2.2s ease-out; border-radius: 4px; }
/* interactive tasks inside the summary */
.doc .note { display: block; width: 100%; min-height: 54px; margin: 8px 0 0; padding: 8px 10px; font: 14px/1.45 system-ui, sans-serif; border: 1px dashed #a0aec0; border-radius: 6px; background: #fbfcfe; color: #1a1a1a; resize: vertical; }
.doc .tq { border: 1.5px solid #cbd5e0; border-radius: 6px; padding: 10px 14px; }
.doc .aufg > .note { margin: 10px 14px 0; width: calc(100% - 28px); }
.doc .tq-a { margin: 8px 0 0; padding: 8px 12px; background: #f0fff4; border-left: 4px solid #2f855a; border-radius: 4px; }
.doc details.sol { margin: 8px 0 0; }
.doc .aufg > details.sol { margin: 8px 14px 12px; }
.doc details.sol > summary { display: inline-block; list-style: none; cursor: pointer; border: 1px solid #cbd5e0; background: #fff; color: #1d2433;
  border-radius: 8px; padding: 5px 12px; font: 600 13px system-ui, sans-serif; user-select: none; }
.doc details.sol > summary::-webkit-details-marker { display: none; }
.doc details.sol > summary:hover { border-color: #1f5f99; }
.doc details.sol > summary .s-hide, .doc details.sol[open] > summary .s-show { display: none; }
.doc details.sol[open] > summary .s-hide { display: inline; }
.doc details.sol[open] > summary { margin-bottom: 8px; }
.doc .aufg details.sol > .a { padding: 0; }
.nojs { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
html:not(.js) .tabs, html:not(.js) .docbar, html:not(.js) #docStat, html:not(.js) .toggle, html:not(.js) .doc .note { display: none !important; }
@media (max-width: 860px) {
  /* Mobile: compact top bar (title, menu button, tabs); navigation opens as a drawer; content scrolls below. */
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  aside { flex: none; overflow: visible; padding: 8px 12px 10px; border-right: none; border-bottom: 1px solid var(--line);
          display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  aside h1 { grid-column: 1; grid-row: 1; margin: 0; font-size: 16px; }
  aside .sub { display: none; }
  .toggle { display: inline-block; grid-column: 2; grid-row: 1; padding: 6px 12px; }
  .tabs { grid-column: 1 / -1; grid-row: 2; margin: 0; }
  .tabs button { padding: 8px 4px; font-size: 14px; }
  .panel-body { display: none; }
  aside.open .panel-body { display: block; position: fixed; left: 0; right: 0; bottom: 0; top: var(--barh, 104px);
          overflow-y: auto; background: var(--panel); padding: 12px 16px 40px; z-index: 20; border-top: 1px solid var(--line); }
  main { flex: 1; min-height: 0; padding: 12px 10px 40px; }
  .card { padding: 16px 14px; }
  .qtext { font-size: 16.5px; }
  .grid { grid-template-columns: repeat(8, 1fr); }
  .paper { padding: 18px 14px 30px; border-radius: 8px; }
  .backbtn { right: 12px; bottom: 12px; }
  .doc .cols { flex-direction: column; gap: 4px; }
  .doc .cols > * { flex: none !important; width: 100%; }
  .doc table { display: block; max-width: 100%; overflow-x: auto; }
  .doc svg { max-width: 100%; height: auto; }
  .doc pre, .doc .stack > pre { overflow-x: auto; }
  .doc .note { font-size: 16px; }
  /* without JavaScript (e.g. phone file preview): normal scrolling document, navigation on top */
  html:not(.js) .app { display: block; height: auto; }
  html:not(.js) aside { display: block; }
  html:not(.js) .panel-body { display: block; }
  html:not(.js) main { overflow: visible; }
}
/* ---------- summary styles (scoped copy of the summary source, inserted by build_lernseite.py) ---------- */
/*__DOCCSS__*/
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <h1>__TITLE__</h1>
    <div class="sub">Zusammenfassung + Probetest · __SUB__</div>
    <div class="tabs"><button id="tabDoc">📖 Zusammenfassung</button><button id="tabQuiz">✎ Probetest</button></div>
    <button class="btn toggle" id="toggle">☰ Inhalt</button>
    <div class="panel-body">
      <div id="docPanel">
        <div id="docStat"><div class="stat"><span id="docProg"></span></div>
        <div class="progress"><div id="docBar"></div></div></div>
        <div class="docbar">
          <button class="btn small" id="showAll">Alle Lösungen zeigen</button>
          <button class="btn small" id="hideAll">Alle verbergen</button>
        </div>
        <noscript><div class="nojs">Vorschau ohne JavaScript: Die Zusammenfassung funktioniert (Lösungen aufklappen mit „Lösung zeigen“). Für den Probetest die Datei in einem Browser öffnen (Safari, Chrome, Firefox).</div></noscript>
        <ul class="toc" id="toc"><!--__TOC__--></ul>
      </div>
      <div id="quizPanel" hidden>
        <div class="progress"><div id="bar"></div></div>
        <div class="stat"><span id="prog">0 / 0 beantwortet</span><span id="checkedInfo"></span></div>
        <label class="mode"><input type="checkbox" id="instant"><span class="sw"></span><span>Sofort prüfen<small id="modeHint"></small></span></label>
        <label class="mode"><input type="checkbox" id="random"><span class="sw"></span><span>Zufällige Reihenfolge<small id="randomHint"></small></span></label>
        <div class="groups" id="groups"></div>
        <div class="legend">
          <span style="--c:var(--tile)">offen</span>
          <span style="--c:var(--answered)">beantwortet</span>
          <span style="--c:var(--ok)">richtig</span>
          <span style="--c:var(--bad)">falsch</span>
          <span style="--c:transparent;--b:var(--bad)">unbeantwortet</span>
          <span style="--c:var(--accent)">Punkt = Eingabefrage</span>
        </div>
      </div>
    </div>
  </aside>
  <main id="docMain">
    <div class="paper doc" id="doc">
<!--__DOC__-->
    </div>
    <button class="btn primary backbtn" id="backToQuiz" hidden>← zurück zum Probetest</button>
  </main>
  <main id="quizMain" hidden>
    <div class="demo" id="demoNote" hidden></div>
    <div class="score" id="score"></div>
    <div class="card" id="card"></div>
    <div class="nav">
      <button class="btn" id="back">← Zurück</button>
      <button class="btn" id="next">Weiter →</button>
      <span class="spacer"></span>
      <button class="btn" id="restart">Neu starten</button>
      <button class="btn primary" id="check">Prüfen</button>
    </div>
    <div class="hint" id="hint"></div>
  </main>
</div>
<script>
/*__QUESTIONS__*/

// ===================================================================== common
const el = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const KEY = '__KEY__';
let view = store.get(KEY + '-view', 'doc');
function setView(v) {
  view = v; store.set(KEY + '-view', v);
  el('docMain').hidden = v !== 'doc'; el('quizMain').hidden = v !== 'quiz';
  el('docPanel').hidden = v !== 'doc'; el('quizPanel').hidden = v !== 'quiz';
  el('tabDoc').classList.toggle('on', v === 'doc'); el('tabQuiz').classList.toggle('on', v === 'quiz');
  el('toggle').textContent = v === 'doc' ? '☰ Inhalt' : '☰ Fragen';
  closeDrawer();
  if (v === 'quiz') render();
}
el('tabDoc').addEventListener('click', () => setView('doc'));
el('tabQuiz').addEventListener('click', () => setView('quiz'));
// Mobile drawer (navigation / question grid) below the top bar.
const mobile = () => window.matchMedia('(max-width: 860px)').matches;
function setBar() { document.documentElement.style.setProperty('--barh', el('side').getBoundingClientRect().height + 'px'); }
function closeDrawer() { el('side').classList.remove('open'); }
el('toggle').addEventListener('click', () => { setBar(); el('side').classList.toggle('open'); });
window.addEventListener('resize', () => { if (!mobile()) closeDrawer(); });

// ===================================================================== summary view
const doc = el('doc');
// Table of contents from the headings (ids are set by the build script).
const heads = [...doc.querySelectorAll('h2[id], h3[id], h4[id]')];
el('toc').addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return;
  e.preventDefault(); closeDrawer(); jumpTo(a.dataset.id, false);
});
function jumpTo(id, flash) {
  const t = document.getElementById(id); if (!t) return;
  setView('doc');
  t.scrollIntoView({ block: 'start' });
  if (flash) { t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
}
// Scroll spy: highlight the last heading above the top of the view.
let spyTimer;
el('docMain').addEventListener('scroll', () => {
  clearTimeout(spyTimer);
  spyTimer = setTimeout(() => {
    const top = el('docMain').getBoundingClientRect().top + 60;
    let cur = heads[0];
    for (const h of heads) { if (h.getBoundingClientRect().top <= top) cur = h; else break; }
    document.querySelectorAll('.toc a').forEach(a => a.classList.toggle('on', cur && a.dataset.id === cur.id));
    store.set(KEY + '-scroll', el('docMain').scrollTop);
  }, 80);
});
// Tasks and theory questions: answer hidden behind a button; own notes are kept in the browser.
const revealKey = KEY + '-revealed', noteKey = KEY + '-notes';
const revealedDoc = new Set(store.get(revealKey, []));
const notes = store.get(noteKey, {});
const items = [...doc.querySelectorAll('[data-rid]')];
function setReveal(item, on) {
  item.querySelector('details.sol').open = on;
  on ? revealedDoc.add(item.dataset.rid) : revealedDoc.delete(item.dataset.rid);
}
function docStats() {
  el('docProg').textContent = `${revealedDoc.size} / ${items.length} Aufgaben & Theoriefragen aufgedeckt`;
  el('docBar').style.width = (100 * revealedDoc.size / items.length) + '%';
  store.set(revealKey, [...revealedDoc]);
}
items.forEach(item => {
  const rid = item.dataset.rid, det = item.querySelector('details.sol');
  det.open = revealedDoc.has(rid);
  det.addEventListener('toggle', () => { det.open ? revealedDoc.add(rid) : revealedDoc.delete(rid); docStats(); });
  const ta = item.querySelector('.note');
  if (ta) {
    ta.value = notes[rid] || '';
    ta.addEventListener('input', () => { notes[rid] = ta.value; store.set(noteKey, notes); });
  }
});
el('showAll').addEventListener('click', () => { items.forEach(i => setReveal(i, true)); docStats(); });
el('hideAll').addEventListener('click', () => { items.forEach(i => setReveal(i, false)); docStats(); });
docStats();
el('backToQuiz').addEventListener('click', () => { el('backToQuiz').hidden = true; setView('quiz'); });

// ===================================================================== quiz
// Question format (see the questions file):
//   multiple choice: {t, q, o:[4 options], c:[correct indices], e, ref}
//   input:           {t, q, kind:'num'|'text'|'set', a:[accepted answers], show:'shown solution', e, ref}
//   ref = section number in the summary (e.g. '3.2'); shown as „Im Skript nachlesen“.
const NQ = QUESTIONS.length;
const LETTERS = ['A', 'B', 'C', 'D'];
const isInput = q => !!q.kind;
const topics = [...new Set(QUESTIONS.map(q => q.t))];
let state;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const shuffled = n => shuffle([...Array(n).keys()]);
function pool() { return QUESTIONS.map((q, i) => i).sort((a, b) => topics.indexOf(QUESTIONS[a].t) - topics.indexOf(QUESTIONS[b].t) || a - b); }
const makeSeq = random => random ? shuffle(pool()) : pool();
function fresh() {
  const instant = state ? state.instant : true, random = state ? state.random : false;
  return { order: QUESTIONS.map(q => isInput(q) ? [] : shuffled(q.o.length)), sel: QUESTIONS.map(q => isInput(q) ? '' : []),
           answers: Array(NQ).fill(null), shown: Array(NQ).fill(false), checked: false, cur: 0, instant, random, seq: makeSeq(random) };
}
function save() { store.set(KEY + '-quiz', state); }
function load() {
  const s = store.get(KEY + '-quiz', null);
  if (s && s.order && s.order.length === NQ && s.answers.length === NQ && s.sel && s.sel.length === NQ
      && QUESTIONS.every((q, i) => isInput(q) ? typeof s.sel[i] === 'string' : Array.isArray(s.sel[i]) && s.order[i].length === q.o.length)) {
    if (!Array.isArray(s.seq) || s.seq.length !== NQ) s.seq = makeSeq(!!s.random);
    if (!(s.cur >= 0 && s.cur < NQ)) s.cur = 0;
    return s;
  }
  return fresh();
}
const qi = () => state.seq[state.cur];
const total = () => state.seq.length;

// Answer normalisation for input questions: case, spaces, subscripts (₁₆), unicode minus, multiplication dot.
function norm(x) {
  return String(x).replace(/[₀-₉]+/g, '').normalize('NFKC').toLowerCase()
    .replace(/[−–]/g, '-').replace(/[·×]/g, '*').replace(/\s+/g, '').replace(/\.$/, '');
}
function setItems(x) {
  const n = norm(x).replace(/^\{|\}$/g, '').replace(/^∅$/, '');
  return n === '' ? [] : [...new Set(n.split(','))].sort();
}
function checkInput(q, ans) {
  if (ans === null || ans === '') return false;
  if (q.kind === 'num') { const v = parseFloat(norm(ans).replace(',', '.')); return q.a.some(x => Math.abs(parseFloat(x) - v) < 1e-9) && /^-?[\d.,]+$/.test(norm(ans)); }
  if (q.kind === 'set') { const s = setItems(ans).join(','); return q.a.some(x => setItems(x).join(',') === s); }
  return q.a.some(x => norm(x) === norm(ans));
}
function revealed(i) { return state.checked || state.shown[i]; }
const isCorrectPos = (i, pos) => QUESTIONS[i].c.includes(state.order[i][pos]);
function isRight(i) {
  const a = state.answers[i], q = QUESTIONS[i];
  if (a === null) return false;
  if (isInput(q)) return checkInput(q, a);
  return a.length === q.c.length && a.every(pos => isCorrectPos(i, pos));
}
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const refTitle = r => { const h = document.getElementById('s-' + r.replace(/\./g, '-')); return h ? h.dataset.toc || h.textContent : 'Abschnitt ' + r; };

function buildSidebar() {
  const groups = el('groups'); groups.innerHTML = '';
  const blocks = state.random ? [['Zufällige Reihenfolge', state.seq.map((q, p) => p)]]
    : topics.map(t => [t, state.seq.map((q, p) => QUESTIONS[q].t === t ? p : -1).filter(p => p >= 0)]).filter(b => b[1].length);
  blocks.forEach(([t, positions]) => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<h2><span>${t}</span><span>${positions.length}</span></h2>`;
    const grid = document.createElement('div'); grid.className = 'grid';
    positions.forEach(pos => {
      const i = state.seq[pos], b = document.createElement('button');
      b.className = 'tile'; b.textContent = pos + 1; b.dataset.i = i;
      b.title = `Frage ${pos + 1} · ${QUESTIONS[i].t}${isInput(QUESTIONS[i]) ? ' · Eingabe' : ''}`;
      b.addEventListener('click', () => { closeDrawer(); go(pos); });
      grid.appendChild(b);
    });
    g.appendChild(grid); groups.appendChild(g);
  });
}
function updateSidebar() {
  document.querySelectorAll('.tile').forEach(b => {
    const i = +b.dataset.i; b.className = 'tile';
    if (isInput(QUESTIONS[i])) b.classList.add('inp');
    if (revealed(i)) b.classList.add(state.answers[i] === null ? 'skipped' : isRight(i) ? 'ok' : 'bad');
    else if (state.answers[i] !== null) b.classList.add('answered');
    if (i === qi()) b.classList.add('current');
  });
  const done = state.seq.filter(i => state.answers[i] !== null).length;
  el('prog').textContent = `${done} / ${total()} beantwortet`;
  el('bar').style.width = (100 * done / total()) + '%';
  const shownIdx = state.seq.filter(i => revealed(i) && state.answers[i] !== null);
  el('checkedInfo').textContent = state.checked ? `${state.seq.filter(isRight).length} richtig`
    : shownIdx.length ? `${shownIdx.filter(isRight).length} / ${shownIdx.length} richtig` : '';
  el('instant').checked = state.instant;
  el('modeHint').textContent = state.instant ? 'Lösung direkt nach jeder Antwort' : 'Lösung erst mit „Prüfen“ am Ende';
  el('random').checked = state.random;
  el('randomHint').textContent = state.random ? 'Fragen gemischt' : 'Fragen nach Thema';
  el('hint').textContent = 'Auswahlfragen: alle zutreffenden Antworten ankreuzen (Tasten 1–4 / A–D). Eingabefragen: Ergebnis eintippen. Dann „Antwort bestätigen“ oder Enter. ←/→ blättern. „Im Skript nachlesen“ springt zur passenden Stelle der Zusammenfassung.';
}
function renderCard() {
  const pos0 = state.cur, i = qi(), q = QUESTIONS[i], ans = state.answers[i], rev = revealed(i);
  const card = el('card');
  card.innerHTML = `<div class="meta"><span class="pill">${q.t}</span>${isInput(q) ? '<span class="pill x">Eingabe</span>' : ''}<span>Frage ${pos0 + 1} von ${total()}</span></div>
    <div class="qtext">${q.q}</div>`;
  if (q.code) { const pre = document.createElement('pre'); pre.textContent = q.code; card.appendChild(pre); }
  if (isInput(q)) {
    const w = document.createElement('div'); w.className = 'inpwrap';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.autocomplete = 'off'; inp.spellcheck = false;
    inp.placeholder = q.kind === 'set' ? 'z.B. {1, 2, 3}' : q.kind === 'num' ? 'Zahl eingeben' : 'Antwort eingeben';
    inp.value = rev ? (ans || '') : state.sel[i];
    if (rev) { inp.disabled = true; if (ans !== null) inp.classList.add(isRight(i) ? 'right' : 'wrong'); }
    else {
      inp.addEventListener('input', () => { state.sel[i] = inp.value; updateConfirm(); save(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmAnswer(); } });
    }
    w.appendChild(inp);
    if (q.unit) { const u = document.createElement('span'); u.className = 'unit'; u.textContent = q.unit; w.appendChild(u); }
    card.appendChild(w);
    if (!rev) setTimeout(() => inp.focus(), 0);
  } else {
    const hint = document.createElement('div'); hint.className = 'multi-hint';
    hint.textContent = 'Mehrfachauswahl: eine oder mehrere Antworten sind richtig.'; card.appendChild(hint);
    const opts = document.createElement('div'); opts.className = 'opts';
    const ticked = rev ? (ans || []) : state.sel[i];
    state.order[i].forEach((oi, pos) => {
      const b = document.createElement('button'); b.className = 'opt';
      b.innerHTML = `<span class="k">${LETTERS[pos]}</span><span>${q.o[oi]}</span>`;
      if (ticked.includes(pos)) b.classList.add('sel');
      if (rev) {
        b.disabled = true;
        const good = q.c.includes(oi);
        if (good && ticked.includes(pos)) b.classList.add('right'); else if (good) b.classList.add('missed'); else if (ticked.includes(pos)) b.classList.add('wrong');
      } else b.addEventListener('click', () => toggle(pos));
      opts.appendChild(b);
    });
    card.appendChild(opts);
  }
  if (!rev) {
    const c = document.createElement('button'); c.className = 'btn primary confirm'; c.id = 'confirm';
    c.addEventListener('click', confirmAnswer); card.appendChild(c); updateConfirm();
  } else {
    const ex = document.createElement('div'); ex.className = 'explain';
    const res = ans === null ? '<b class="res-bad">Nicht beantwortet.</b> ' : isRight(i) ? '<b class="res-ok">Richtig.</b> ' : '<b class="res-bad">Falsch.</b> ';
    const sol = isInput(q) ? `<span class="nc">Richtige Antwort: <b>${q.show || q.a[0]}</b></span><br>`
      : `<span class="nc">${q.c.length === 1 ? '1 Antwort' : q.c.length + ' Antworten'} richtig (grün; gestrichelt = nicht angekreuzt).</span> `;
    ex.innerHTML = res + sol + (q.e || '');
    if (q.ref) {
      const r = document.createElement('button');
      r.className = 'btn small reflink' + (ans !== null && !isRight(i) ? ' primary' : '');
      r.textContent = '📖 Im Skript nachlesen: ' + refTitle(q.ref);
      r.addEventListener('click', () => { el('backToQuiz').hidden = false; jumpTo('s-' + q.ref.replace(/\./g, '-'), true); });
      ex.appendChild(document.createElement('br')); ex.appendChild(r);
    }
    card.appendChild(ex);
  }
  el('back').disabled = pos0 === 0; el('next').disabled = pos0 === total() - 1;
  el('check').textContent = state.checked || state.instant ? 'Ergebnis' : 'Prüfen';
  el('next').classList.toggle('pulse', rev && !state.checked && pos0 < total() - 1);
}
function pending(i) {
  const q = QUESTIONS[i], s = state.sel[i], a = state.answers[i];
  if (isInput(q)) return s.trim() !== '' && s.trim() !== a;
  return s.length && !(a && sameSet(a, s));
}
function updateConfirm() {
  const c = el('confirm'); if (!c) return;
  const i = qi(), p = pending(i);
  c.disabled = !p; c.textContent = !p && state.answers[i] !== null ? 'Bestätigt ✓' : 'Antwort bestätigen';
}
function renderScore() {
  const s = el('score');
  if (!state.checked) { s.classList.remove('show'); return; }
  const right = state.seq.filter(isRight).length;
  const rows = topics.map(t => [t, state.seq.filter(i => QUESTIONS[i].t === t)]).filter(r => r[1].length)
    .map(([t, idx]) => { const r = idx.filter(isRight).length; return `<tr><td>${t}</td><td>${r} / ${idx.length} (${Math.round(100 * r / idx.length)} %)</td></tr>`; }).join('');
  const open = state.seq.filter(i => state.answers[i] === null).length;
  s.innerHTML = `<div class="big">${right} / ${total()} richtig · ${Math.round(100 * right / total())} %</div>
    <div class="sub">${open ? open + ' Fragen unbeantwortet (zählen als falsch). ' : ''}Rote Kacheln links anklicken, um Fehler anzusehen – dort führt „Im Skript nachlesen“ zur passenden Stelle.</div><table>${rows}</table>`;
  s.classList.add('show');
}
function render() {
  const demo = QUESTIONS.some(q => q.demo);
  el('demoNote').hidden = !demo;
  el('demoNote').innerHTML = '<b>Platzhalter:</b> Diese Fragen zeigen nur die Funktionen (Auswahl- und Eingabefragen, Sprung ins Skript). Der echte Probetest folgt.';
  renderCard(); updateSidebar(); renderScore(); save();
}
function go(pos) {
  state.cur = Math.max(0, Math.min(total() - 1, pos)); render();
  el('quizMain').scrollTop = 0;
  const t = document.querySelector('.tile.current'); if (t && window.innerWidth > 860) t.scrollIntoView({ block: 'nearest' });
}
function toggle(pos) {
  const i = qi(); if (isInput(QUESTIONS[i]) || revealed(i) || pos < 0 || pos >= QUESTIONS[i].o.length) return;
  const s = state.sel[i]; state.sel[i] = s.includes(pos) ? s.filter(x => x !== pos) : [...s, pos].sort(); render();
}
let advanceTimer = null;
function confirmAnswer() {
  const i = qi(), q = QUESTIONS[i];
  if (revealed(i) || !pending(i)) return;
  state.answers[i] = isInput(q) ? state.sel[i].trim() : [...state.sel[i]];
  clearTimeout(advanceTimer);
  if (state.instant) { state.shown[i] = true; render(); return; }
  render();
  advanceTimer = setTimeout(() => {
    const from = state.cur; let nxt = state.seq.findIndex((x, p) => p > from && state.answers[x] === null);
    if (nxt === -1) nxt = from < total() - 1 ? from + 1 : from; if (nxt !== from) go(nxt);
  }, 250);
}
el('back').addEventListener('click', () => go(state.cur - 1));
el('next').addEventListener('click', () => go(state.cur + 1));
el('check').addEventListener('click', () => {
  if (!state.checked) {
    const open = state.seq.filter(i => state.answers[i] === null).length;
    if (open && !confirm(`${open} Fragen sind noch offen. Trotzdem prüfen?`)) return;
    state.checked = true;
  }
  render(); el('quizMain').scrollTop = 0;
});
el('restart').addEventListener('click', () => {
  if (!confirm('Alle Antworten löschen und neu starten?')) return;
  state = fresh(); buildSidebar(); render();
});
el('instant').addEventListener('change', e => { state.instant = e.target.checked; render(); });
el('random').addEventListener('change', e => { state.random = e.target.checked; const q = qi(); state.seq = makeSeq(state.random); state.cur = Math.max(0, state.seq.indexOf(q)); buildSidebar(); render(); });
document.addEventListener('keydown', e => {
  if (view !== 'quiz' || ['INPUT', 'TEXTAREA'].includes(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft') go(state.cur - 1);
  else if (k === 'arrowright') go(state.cur + 1);
  else if (k === 'enter') { if (e.target.tagName === 'BUTTON') return; pending(qi()) ? confirmAnswer() : go(state.cur + 1); }
  else if (['1', '2', '3', '4'].includes(k)) toggle(+k - 1);
  else if (['a', 'b', 'c', 'd'].includes(k)) toggle(k.charCodeAt(0) - 97);
});

state = load();
buildSidebar();
setView(view);
el('docMain').scrollTop = store.get(KEY + '-scroll', 0);
</script>
</body>
</html>
