<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SE Probetest Teil 2</title>
<style>
:root {
  --bg: #f4f6fa; --panel: #ffffff; --text: #1d2433; --muted: #5d6677; --line: #dde3ec;
  --accent: #1f5f99; --accent-soft: #e4eef9; --tile: #eef1f6; --tile-text: #3b4456;
  --answered: #c9dcf2; --ok: #1e8a4c; --ok-soft: #dff3e7; --bad: #c0392b; --bad-soft: #fbe3e0;
  --code-bg: #f1f3f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --panel: #1b212b; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3442;
    --accent: #6aa8e8; --accent-soft: #1f3048; --tile: #232b37; --tile-text: #c4cad5;
    --answered: #2c4a6e; --ok: #4cc47f; --ok-soft: #173826; --bad: #ef6b5b; --bad-soft: #43201c;
    --code-bg: #232a35;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --panel: #1b212b; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c3442;
  --accent: #6aa8e8; --accent-soft: #1f3048; --tile: #232b37; --tile-text: #c4cad5;
  --answered: #2c4a6e; --ok: #4cc47f; --ok-soft: #173826; --bad: #ef6b5b; --bad-soft: #43201c;
  --code-bg: #232a35;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
aside h1 { font-size: 17px; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.progress { height: 6px; background: var(--tile); border-radius: 3px; overflow: hidden; margin: 6px 0 4px; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.stat { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
.group { margin-top: 14px; }
.group h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.tile { aspect-ratio: 1; border: 1px solid transparent; border-radius: 5px; background: var(--tile); color: var(--tile-text); font: 600 12px/1 system-ui, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.tile:hover { border-color: var(--accent); }
.tile.answered { background: var(--answered); }
.tile.current { outline: 2px solid var(--accent); outline-offset: 1px; }
.tile.ok { background: var(--ok); color: #fff; }
.tile.bad { background: var(--bad); color: #fff; }
.tile.skipped { background: transparent; border: 1px dashed var(--bad); color: var(--bad); }
.tile { position: relative; }
.tile.ext::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.tile.ok.ext::after, .tile.bad.ext::after { background: #fff; }
.pill.x { background: transparent; border: 1px solid var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 12px; font-size: 12px; color: var(--muted); margin-top: 14px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--c); border: 1px solid var(--b, transparent); }
main { overflow-y: auto; padding: 28px 32px 40px; }
.card { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px 26px; }
.meta { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 10px; flex-wrap: wrap; }
.pill { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-weight: 600; }
.q { font-size: 18px; font-weight: 600; margin: 4px 0 14px; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font: 13.5px/1.45 ui-monospace, "DejaVu Sans Mono", monospace; margin: 0 0 14px; }
code { background: var(--code-bg); border-radius: 3px; padding: 0 4px; font: 0.92em ui-monospace, "DejaVu Sans Mono", monospace; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; background: var(--panel); color: var(--text); border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 14px; font: inherit; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--tile); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { background: var(--accent); color: #fff; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt .k { border-radius: 5px; }
.opt.missed { border-style: dashed; border-color: var(--ok); }
.opt.missed .k { background: transparent; color: var(--ok); border: 1.5px dashed var(--ok); }
.multi-hint { font-size: 13px; color: var(--muted); margin: -8px 0 12px; }
.confirm { margin-top: 14px; }
.explain .nc { color: var(--muted); }
.opt:disabled { cursor: default; }
.explain { margin-top: 14px; padding: 12px 14px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 4px; font-size: 14px; }
.explain b.res-ok { color: var(--ok); } .explain b.res-bad { color: var(--bad); }
.nav { max-width: 820px; margin: 16px auto 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.nav .spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 9px 16px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.score { max-width: 820px; margin: 0 auto 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; display: none; }
.score.show { display: block; }
.score .big { font-size: 26px; font-weight: 700; }
.score table { border-collapse: collapse; margin-top: 8px; font-size: 14px; width: 100%; }
.score td { padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); }
.score td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.hint { max-width: 820px; margin: 14px auto 0; color: var(--muted); font-size: 12.5px; }
.toggle { display: none; }
.mode { display: flex; align-items: center; gap: 10px; margin: 12px 0 2px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 14px; user-select: none; }
.mode input { position: absolute; opacity: 0; pointer-events: none; }
.mode .sw { flex: none; width: 36px; height: 20px; border-radius: 999px; background: var(--tile); border: 1px solid var(--line); position: relative; transition: background .15s; }
.mode .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.mode input:checked + .sw { background: var(--accent); border-color: var(--accent); }
.mode input:checked + .sw::after { transform: translateX(16px); background: #fff; }
.mode input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
.mode small { display: block; color: var(--muted); font-size: 12px; }
.btn.pulse { border-color: var(--accent); color: var(--accent); }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; height: auto; }
  aside { border-right: none; border-bottom: 1px solid var(--line); max-height: none; }
  aside.collapsed .groups, aside.collapsed .legend { display: none; }
  .toggle { display: inline-block; margin-top: 8px; }
  .grid { grid-template-columns: repeat(10, 1fr); }
  main { padding: 16px; }
  .card { padding: 18px 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <h1>SE Probetest · Teil 2</h1>
    <div class="sub">JTBD · Product Vision · HTML · CSS · JavaScript</div>
    <div class="progress"><div id="bar"></div></div>
    <div class="stat"><span id="prog">0 / 0 beantwortet</span><span id="checkedInfo"></span></div>
    <label class="mode">
      <input type="checkbox" id="instant">
      <span class="sw"></span>
      <span>Sofort prüfen<small id="modeHint"></small></span>
    </label>
    <label class="mode">
      <input type="checkbox" id="random">
      <span class="sw"></span>
      <span>Zufällige Reihenfolge<small id="randomHint"></small></span>
    </label>
    <label class="mode" id="extendedRow" hidden>
      <input type="checkbox" id="extended">
      <span class="sw"></span>
      <span>Erweiterter Modus<small id="extendedHint"></small></span>
    </label>
    <button class="btn toggle" id="toggle">Fragenübersicht ein/aus</button>
    <div class="groups" id="groups"></div>
    <div class="legend">
      <span style="--c:var(--tile)">offen</span>
      <span style="--c:var(--answered)">beantwortet</span>
      <span style="--c:var(--ok)">richtig</span>
      <span style="--c:var(--bad)">falsch</span>
      <span style="--c:transparent;--b:var(--ok)">übersehen</span>
      <span style="--c:transparent;--b:var(--bad)">unbeantwortet</span>
      <span id="extLegend" hidden style="--c:var(--accent)">Punkt = erweiterte Frage</span>
    </div>
  </aside>
  <main>
    <div class="score" id="score"></div>
    <div class="card" id="card"></div>
    <div class="nav">
      <button class="btn" id="back">← Zurück</button>
      <button class="btn" id="next">Weiter →</button>
      <span class="spacer"></span>
      <button class="btn" id="restart">Neu starten</button>
      <button class="btn primary" id="check">Prüfen</button>
    </div>
    <div class="hint" id="hint"></div>
  </main>
</div>
<script>
/*__QUESTIONS__*/

const KEY = 'se-probetest-teil2-v3';
// Questions with x:1 belong to the extended mode: same concepts, new examples.
// They are only part of the run (grid, numbering, score) while the toggle is on.
const NQ = QUESTIONS.length;
const HAS_EXT = QUESTIONS.some(q => q.x);
const LETTERS = ['A', 'B', 'C', 'D'];
let state;

function shuffled(n) { return shuffle([...Array(n).keys()]); }
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const topics = [...new Set(QUESTIONS.map(q => q.t))];
// Active questions in topic order (core before extended within a topic).
function pool(extended) {
  return QUESTIONS.map((q, i) => i).filter(i => extended || !QUESTIONS[i].x)
    .sort((a, b) => topics.indexOf(QUESTIONS[a].t) - topics.indexOf(QUESTIONS[b].t)
      || (QUESTIONS[a].x ? 1 : 0) - (QUESTIONS[b].x ? 1 : 0) || a - b);
}
function makeSeq(random, extended) { return random ? shuffle(pool(extended)) : pool(extended); }
// Per question (indexed by question, not display position):
//   order  – shuffled option indices, sel – ticked display positions,
//   answers – confirmed selection (array of positions) or null, shown – revealed in instant mode.
// seq is the display order of the active questions, cur a position in seq.
function fresh() {
  const instant = state ? state.instant : true;
  const random = state ? state.random : false;
  const extended = state ? state.extended : false;
  return { order: QUESTIONS.map(q => shuffled(q.o.length)), sel: QUESTIONS.map(() => []), answers: Array(NQ).fill(null), shown: Array(NQ).fill(false), checked: false, cur: 0, instant, random, extended, seq: makeSeq(random, extended) };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.order && s.order.length === NQ && s.answers.length === NQ && s.sel && s.sel.length === NQ) {
      if (!Array.isArray(s.shown) || s.shown.length !== NQ) s.shown = s.answers.map(() => !!s.checked);
      if (typeof s.instant !== 'boolean') s.instant = true;
      if (typeof s.random !== 'boolean') s.random = false;
      if (typeof s.extended !== 'boolean' || !HAS_EXT) s.extended = false;
      const p = pool(s.extended);
      if (!Array.isArray(s.seq) || s.seq.length !== p.length || !p.every(i => s.seq.includes(i))) s.seq = makeSeq(s.random, s.extended);
      if (!(s.cur >= 0 && s.cur < s.seq.length)) s.cur = 0;
      return s;
    }
  } catch (e) {}
  return fresh();
}

const el = id => document.getElementById(id);
const qi = () => state.seq[state.cur];
const total = () => state.seq.length;

function buildSidebar() {
  const groups = el('groups');
  groups.innerHTML = '';
  // Random order: one flat block in seq order. Topic order: one block per topic.
  const blocks = state.random
    ? [['Zufällige Reihenfolge', state.seq.map((q, pos) => pos)]]
    : topics.map(t => [t, state.seq.map((q, pos) => QUESTIONS[q].t === t ? pos : -1).filter(p => p >= 0)]).filter(b => b[1].length);
  blocks.forEach(([t, positions]) => {
    const g = document.createElement('div');
    g.className = 'group';
    g.innerHTML = `<h2><span>${t}</span><span>${positions.length}</span></h2>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    positions.forEach(pos => {
      const i = state.seq[pos];
      const b = document.createElement('button');
      b.className = 'tile';
      b.textContent = pos + 1;
      b.dataset.i = i;
      b.title = `Frage ${pos + 1} · ${QUESTIONS[i].t}${QUESTIONS[i].x ? ' · erweitert' : ''}`;
      b.addEventListener('click', () => go(pos));
      grid.appendChild(b);
    });
    g.appendChild(grid);
    groups.appendChild(g);
  });
}

// A question shows its solution once it was confirmed in instant mode, or after the final check.
function revealed(i) { return state.checked || state.shown[i]; }
const isCorrectPos = (i, pos) => QUESTIONS[i].c.includes(state.order[i][pos]);
// All-or-nothing: right only if exactly the correct options are ticked.
function isRight(i) {
  const a = state.answers[i];
  if (a === null) return false;
  return a.length === QUESTIONS[i].c.length && a.every(pos => isCorrectPos(i, pos));
}

function updateSidebar() {
  document.querySelectorAll('.tile').forEach(b => {
    const i = +b.dataset.i;
    b.className = 'tile';
    if (QUESTIONS[i].x) b.classList.add('ext');
    if (revealed(i)) b.classList.add(state.answers[i] === null ? 'skipped' : isRight(i) ? 'ok' : 'bad');
    else if (state.answers[i] !== null) b.classList.add('answered');
    if (i === qi()) b.classList.add('current');
  });
  const done = state.seq.filter(i => state.answers[i] !== null).length;
  el('prog').textContent = `${done} / ${total()} beantwortet`;
  el('bar').style.width = (100 * done / total()) + '%';
  const shownIdx = state.seq.filter(i => revealed(i) && state.answers[i] !== null);
  el('checkedInfo').textContent = state.checked
    ? `${state.seq.filter(isRight).length} richtig`
    : shownIdx.length ? `${shownIdx.filter(isRight).length} / ${shownIdx.length} richtig` : '';
  el('instant').checked = state.instant;
  el('modeHint').textContent = state.instant ? 'Lösung direkt nach jeder Antwort' : 'Lösung erst mit „Prüfen“ am Ende';
  el('random').checked = state.random;
  el('randomHint').textContent = state.random ? 'Fragen gemischt' : 'Fragen nach Thema';
  el('extendedRow').hidden = !HAS_EXT;
  el('extLegend').hidden = !HAS_EXT || !state.extended;
  el('extended').checked = state.extended;
  const nExt = QUESTIONS.filter(q => q.x).length;
  el('extendedHint').textContent = state.extended
    ? `+${nExt} Fragen: gleiche Inhalte, neue Beispiele`
    : `aus: nur Kernfragen (${NQ - nExt})`;
  el('hint').textContent = (state.instant
    ? 'Alle zutreffenden Antworten ankreuzen, dann „Antwort bestätigen“ (oder Enter) → richtig/falsch und Erklärung erscheinen, mit „Weiter“, → oder Enter zur nächsten Frage.'
    : 'Alle zutreffenden Antworten ankreuzen, dann „Antwort bestätigen“ (oder Enter) → nächste Frage erscheint. „Prüfen“ zeigt am Ende Lösungen und Punkte.')
    + ' Tastatur: 1–4 bzw. A–D an-/abwählen, ←/→ blättern. Eine Frage zählt nur, wenn genau die richtigen Antworten angekreuzt sind.';
}

function renderCard() {
  const pos0 = state.cur, i = qi(), q = QUESTIONS[i], ord = state.order[i], sel = state.sel[i], ans = state.answers[i], rev = revealed(i);
  const card = el('card');
  card.innerHTML = `
    <div class="meta"><span class="pill">${q.t}</span>${q.x ? '<span class="pill x">erweitert</span>' : ''}<span>Frage ${pos0 + 1} von ${total()}</span><span>· Typ ${q.y}</span></div>
    <div class="q">${q.q}</div>
    <div class="multi-hint">Mehrfachauswahl: eine oder mehrere Antworten sind richtig.</div>`;
  if (q.code) {
    const pre = document.createElement('pre');
    pre.textContent = q.code;
    card.appendChild(pre);
  }
  const opts = document.createElement('div');
  opts.className = 'opts';
  const ticked = rev ? (ans || []) : sel;
  ord.forEach((oi, pos) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.setAttribute('role', 'checkbox');
    b.setAttribute('aria-checked', ticked.includes(pos));
    b.innerHTML = `<span class="k">${LETTERS[pos]}</span><span>${q.o[oi]}</span>`;
    if (ticked.includes(pos)) b.classList.add('sel');
    if (rev) {
      b.disabled = true;
      const good = q.c.includes(oi);
      if (good && ticked.includes(pos)) b.classList.add('right');
      else if (good) b.classList.add('missed');
      else if (ticked.includes(pos)) b.classList.add('wrong');
    } else {
      b.addEventListener('click', () => toggle(pos));
    }
    opts.appendChild(b);
  });
  card.appendChild(opts);
  if (!rev) {
    const c = document.createElement('button');
    c.className = 'btn primary confirm';
    c.id = 'confirm';
    c.textContent = ans !== null && sameSet(ans, sel) ? 'Bestätigt ✓' : 'Antwort bestätigen';
    c.disabled = !sel.length || (ans !== null && sameSet(ans, sel));
    c.addEventListener('click', confirmAnswer);
    card.appendChild(c);
  } else {
    const ex = document.createElement('div');
    ex.className = 'explain';
    const nC = q.c.length;
    const res = ans === null ? '<b class="res-bad">Nicht beantwortet.</b> '
      : isRight(i) ? '<b class="res-ok">Richtig.</b> '
      : `<b class="res-bad">Falsch.</b> `;
    ex.innerHTML = res + `<span class="nc">${nC === 1 ? '1 Antwort' : nC + ' Antworten'} richtig (grün; gestrichelt = nicht angekreuzt).</span> ` + q.e;
    card.appendChild(ex);
  }
  el('back').disabled = pos0 === 0;
  el('next').disabled = pos0 === total() - 1;
  el('check').textContent = state.checked || state.instant ? 'Ergebnis' : 'Prüfen';
  el('next').classList.toggle('pulse', rev && !state.checked && pos0 < total() - 1);
}
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));

function renderScore() {
  const s = el('score');
  if (!state.checked) { s.classList.remove('show'); return; }
  const right = state.seq.filter(isRight).length;
  const row = (label, idx) => {
    const r = idx.filter(isRight).length;
    return `<tr><td>${label}</td><td>${r} / ${idx.length} (${Math.round(100 * r / idx.length)} %)</td></tr>`;
  };
  let rows = topics.map(t => [t, state.seq.filter(i => QUESTIONS[i].t === t)]).filter(r => r[1].length).map(r => row(...r)).join('');
  if (state.extended) rows += row('<b>Kernfragen</b>', state.seq.filter(i => !QUESTIONS[i].x)) + row('<b>Erweiterte Fragen</b>', state.seq.filter(i => QUESTIONS[i].x));
  const open = state.seq.filter(i => state.answers[i] === null).length;
  s.innerHTML = `<div class="big">${right} / ${total()} richtig · ${Math.round(100 * right / total())} %</div>
    <div class="sub">${open ? open + ' Fragen unbeantwortet (zählen als falsch). ' : ''}Eine Frage zählt nur bei genau den richtigen Kreuzen. Rote Kacheln links anklicken, um Fehler anzusehen.</div>
    <table>${rows}</table>`;
  s.classList.add('show');
}

function render() { renderCard(); updateSidebar(); renderScore(); save(); }

function go(pos) {
  state.cur = Math.max(0, Math.min(total() - 1, pos));
  render();
  document.querySelector('main').scrollTop = 0;
  const t = document.querySelector('.tile.current');
  if (t && window.innerWidth > 860) t.scrollIntoView({ block: 'nearest' });
}

function toggle(pos) {
  const i = qi();
  if (revealed(i) || pos < 0 || pos >= QUESTIONS[i].o.length) return;
  const s = state.sel[i];
  state.sel[i] = s.includes(pos) ? s.filter(x => x !== pos) : [...s, pos].sort();
  render();
}

let advanceTimer = null;
function confirmAnswer() {
  const i = qi();
  if (revealed(i) || !state.sel[i].length) return;
  state.answers[i] = [...state.sel[i]];
  clearTimeout(advanceTimer);
  if (state.instant) {
    state.shown[i] = true;
    render();
    return;
  }
  render();
  advanceTimer = setTimeout(() => {
    const from = state.cur;
    let nxt = state.seq.findIndex((q, p) => p > from && state.answers[q] === null);
    if (nxt === -1) nxt = from < total() - 1 ? from + 1 : from;
    if (nxt !== from) go(nxt);
  }, 250);
}

// Rebuild the order after a toggle and keep the current question selected when it is still active.
function reorder() {
  const q = qi();
  state.seq = makeSeq(state.random, state.extended);
  state.cur = Math.max(0, state.seq.indexOf(q));
  buildSidebar();
  render();
}

el('back').addEventListener('click', () => go(state.cur - 1));
el('next').addEventListener('click', () => go(state.cur + 1));
el('check').addEventListener('click', () => {
  if (!state.checked) {
    const open = state.seq.filter(i => state.answers[i] === null).length;
    if (open && !confirm(`${open} Fragen sind noch offen. Trotzdem prüfen?`)) return;
    state.checked = true;
  }
  render();
  document.querySelector('main').scrollTop = 0;
});
el('restart').addEventListener('click', () => {
  if (!confirm('Alle Antworten löschen und neu starten (Antwortreihenfolge und ggf. Fragenreihenfolge werden neu gemischt)?')) return;
  state = fresh();
  buildSidebar();
  render();
});
el('instant').addEventListener('change', e => { state.instant = e.target.checked; render(); });
el('random').addEventListener('change', e => { state.random = e.target.checked; reorder(); });
el('extended').addEventListener('change', e => { state.extended = e.target.checked; reorder(); });
el('toggle').addEventListener('click', () => el('side').classList.toggle('collapsed'));

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const i = qi();
  if (k === 'arrowleft') go(state.cur - 1);
  else if (k === 'arrowright') go(state.cur + 1);
  else if (k === 'enter') {
    if (e.target.tagName === 'BUTTON') return;
    const pending = !revealed(i) && state.sel[i].length && !(state.answers[i] && sameSet(state.answers[i], state.sel[i]));
    pending ? confirmAnswer() : go(state.cur + 1);
  }
  else if (['1', '2', '3', '4'].includes(k)) toggle(+k - 1);
  else if (['a', 'b', 'c', 'd'].includes(k)) toggle(k.charCodeAt(0) - 97);
});

state = load();
buildSidebar();
if (window.innerWidth <= 860) el('side').classList.add('collapsed');
render();
</script>
</body>
</html>
